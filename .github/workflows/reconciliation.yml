name: OTP reconciliation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otp-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reconcile activations, expirations and webhooks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}"
          test -n "${APP_BASE_URL}"
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/internal/reconciliation"
